name: 오늘의퍼포먼스봇

# 매일 오전 6시 10분(KST) 국내·글로벌 퍼포먼스 표 + 플레이북 조언을 Slack 채널에 게시
on:
  schedule:
    - cron: '10 21 * * *'   # 21:10 UTC = 06:10 KST. 오프아워 분(:10)로 GitHub cron 드롭 완화 (GitHub 스케줄은 수시간 지연될 수 있음)
  workflow_dispatch:        # 수동 실행 버튼

concurrency:
  group: dashboard-bot
  cancel-in-progress: false

jobs:
  post:
    name: 퍼포먼스봇 게시
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install anthropic
      - name: Run dashboard_bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_SCHEMA: ${{ secrets.SUPABASE_DB_SCHEMA }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CH_KR_MARKETING: ${{ secrets.SLACK_CH_KR_MARKETING }}
          SLACK_CH_GL_MARKETING: ${{ secrets.SLACK_CH_GL_MARKETING }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Meta effective_status 조회용 — 하이라이트를 '현재 활성' 세트로 한정하기 위함
          META_TOKEN_1: ${{ secrets.META_TOKEN_1 }}
          META_TOKEN_2: ${{ secrets.META_TOKEN_2 }}
          META_TOKEN_3: ${{ secrets.META_TOKEN_3 }}
          META_TOKEN_4: ${{ secrets.META_TOKEN_4 }}
          META_TOKEN_GlobalTT: ${{ secrets.META_TOKEN_GlobalTT }}
          META_TOKEN_ACT_9937: ${{ secrets.META_TOKEN_ACT_9937 }}
        run: python dashboard_bot.py
