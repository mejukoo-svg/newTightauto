name: 💬 대만 LINE CRM 매출 → Supabase

# Mixpanel ch=line & ct=crm* 결제를 일자×캠페인(ct)으로 집계 → line_crm_daily_campaign.
# 매출탭(chrev) '대만 LINE CRM' 채널(글로벌·우리)의 소스.
concurrency:
  group: line-crm-revenue
  cancel-in-progress: false

on:
  schedule:
    - cron: '47 * * * *'   # 매시 47분 (다른 파이프라인 :07/:22/:37 과 겹치지 않게)
  workflow_dispatch:
    inputs:
      full_refresh:
        description: '전체 기간 갱신(2026-07-01~오늘)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      refresh_days:
        description: '갱신 기간(일)'
        required: false
        default: '10'
        type: choice
        options:
          - '4'
          - '10'
          - '30'
          - '90'

jobs:
  line-crm:
    name: 대만 LINE CRM 매출
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run 대만 LINE CRM
        env:
          MIXPANEL_PROJECT_ID: ${{ secrets.MIXPANEL_PROJECT_ID }}
          MIXPANEL_USERNAME: ${{ secrets.MIXPANEL_USERNAME }}
          MIXPANEL_SECRET: ${{ secrets.MIXPANEL_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_SCHEMA: ${{ secrets.SUPABASE_DB_SCHEMA }}
          FULL_REFRESH: ${{ github.event.inputs.full_refresh || 'false' }}
          REFRESH_DAYS: ${{ github.event.inputs.refresh_days || '10' }}
        run: python 대만라인_CRM_supabase.py
